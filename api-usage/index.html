<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>API 用量 · GLM 共享反推</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #eef1f6; --card: #fff; --text: #101828; --text-2: #475467; --text-3: #98a2b3;
  --line: #e4e7ec; --blue: #4f6df5; --green: #10a37f; --red: #d92d20;
}
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 14px; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 26px 20px 40px; display: flex; flex-direction: column; gap: 16px; }

/* ---------- 顶栏 ---------- */
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.topbar h1 { font-size: 21px; font-weight: 700; letter-spacing: .2px; }
.subtitle { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tabs { display: flex; background: #e2e6ee; border-radius: 10px; padding: 3px; }
.tabs button {
  border: none; background: transparent; color: var(--text-2); font-size: 13px;
  padding: 6px 13px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: all .15s ease;
}
.tabs button:hover { color: var(--text); }
.tabs button.active { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,.12); }
.refresh {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff;
  color: var(--text-2); font-size: 13px; padding: 7px 14px; border-radius: 10px; cursor: pointer;
  font-family: inherit; transition: all .15s ease;
}
.refresh:hover { border-color: #c8cdd8; color: var(--text); }
.refresh:disabled { opacity: .6; cursor: wait; }
.refresh svg { transition: transform .6s ease; }
.refresh.spinning svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.countdown { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; min-width: 72px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border-radius: 16px; padding: 20px 22px 18px;
  box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
}
.card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
.card-head h2 { font-size: 16px; font-weight: 700; }
.card-sub { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }

/* ---------- 状态行 ---------- */
.status-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
.badge.ok { background: #ecfdf3; color: #067647; }
.badge.stale { background: #fffaeb; color: #b54708; }
.badge.warn { background: #fef3f2; color: #b42318; }
.badge.muted { background: #f2f4f7; color: #667085; }
.note { font-size: 12px; color: var(--text-3); }
.back-home {
  display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
  border: 1px solid var(--line); background: #fff; color: var(--text-2);
  font-size: 12.5px; padding: 5px 13px; border-radius: 999px; margin-bottom: 9px;
  transition: all .15s ease; font-family: inherit;
}
.back-home:hover { border-color: #c8cdd8; color: var(--text); }
.quota-chip {
  font-size: 12px; background: #f5f7ff; border: 1px solid #e3e8ff; color: #3538cd;
  border-radius: 8px; padding: 5px 10px;
}
.quota-chip b { font-variant-numeric: tabular-nums; }

/* ---------- 套餐额度卡片 ---------- */
.quota-wrap { margin: 0 0 16px; }
.quota-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; }
.q-card { background: #f8fafc; border: 1px solid #eef1f5; border-radius: 12px; padding: 13px 16px 12px; }
.q-card.warn { background: #fffcf5; border-color: #fdeccb; }
.q-card.danger { background: #fef5f4; border-color: #fbd3cf; }
.q-head { display: flex; justify-content: space-between; align-items: baseline; }
.q-label { font-size: 13px; font-weight: 600; color: var(--text); }
.q-pct { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-2); }
.q-card.warn .q-pct { color: #b54708; }
.q-card.danger .q-pct { color: #b42318; }
.q-bar { height: 8px; border-radius: 4px; background: #e9edf3; overflow: hidden; margin: 9px 0 8px; }
.q-fill { height: 100%; border-radius: 4px; background: var(--green); transition: width .6s ease; }
.q-card.warn .q-fill { background: #f79009; }
.q-card.danger .q-fill { background: var(--red); }
.q-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--text-3); flex-wrap: wrap; }
.q-meta .q-used { font-variant-numeric: tabular-nums; }
.q-meta .q-reset { font-variant-numeric: tabular-nums; color: var(--text-2); }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi { background: #f8fafc; border: 1px solid #eef1f5; border-radius: 12px; padding: 13px 16px 12px; }
.kpi .k-label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); }
.kpi .k-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.kpi .k-value { margin-top: 6px; font-size: 22px; font-weight: 700; letter-spacing: .2px; font-variant-numeric: tabular-nums; }
.kpi .k-extra { margin-top: 2px; font-size: 11.5px; color: var(--text-3); }

/* ---------- 按天堆叠柱 ---------- */
.chart-title { font-size: 12.5px; color: var(--text-2); margin: 4px 0 8px; }
.shared-days { display: flex; align-items: flex-end; gap: 4px; height: 110px; }
.shared-day { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; min-width: 3px; }
.shared-day .sd-bar {
  width: 100%; background: var(--red); border-radius: 3px 3px 0 0;
  display: flex; flex-direction: column; justify-content: flex-start; min-height: 2px;
}
.shared-day .sd-mine { width: 100%; background: var(--green); border-radius: 3px 3px 0 0; }
.shared-day .dt { font-size: 9.5px; color: var(--text-3); text-align: center; margin-top: 4px; white-space: nowrap; }
.shared-day.empty .dt { opacity: .45; }
.shared-day.empty .sd-bar { background: #f0f2f5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0f2f5; }
.legend .li { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); }
.legend .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.legend .li .val { color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ---------- 按模型 ---------- */
.models { margin-top: 10px; }
.sub-title { font-size: 12.5px; color: var(--text-2); margin: 6px 0 8px; }
.mrow { display: grid; grid-template-columns: 150px 1fr 84px; align-items: center; gap: 12px; margin-bottom: 10px; }
.mrow .mname {
  font-size: 12.5px; color: var(--text-2); text-align: right; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; font-family: "Segoe UI", Consolas, monospace;
}
.mrow:hover .mname { color: var(--text); }
.mbar-wrap { position: relative; height: 22px; }
.mbar { display: flex; height: 100%; width: 100%; border-radius: 5px; overflow: hidden; opacity: .95; }
.mrow:hover .mbar { opacity: 1; }
.mbar .seg { height: 100%; cursor: default; }
.mrow .mtotal { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; font-family: "Segoe UI", Consolas, monospace; }

/* ---------- 空态 / 页脚 ---------- */
.chart-empty { display: flex; align-items: center; justify-content: center; min-height: 180px; color: var(--text-3); font-size: 13px; }
footer { font-size: 12px; color: var(--text-3); line-height: 1.9; padding: 2px 4px; }
footer b { color: var(--text-2); font-weight: 600; }

/* ---------- Tooltip ---------- */
.tooltip {
  position: fixed; z-index: 50; background: #101828; color: #fff; border-radius: 10px;
  padding: 10px 12px; font-size: 12px; line-height: 1.8; pointer-events: none;
  box-shadow: 0 8px 24px rgba(16,24,40,.3); max-width: 320px; display: none;
}

@media (max-width: 720px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .mrow { grid-template-columns: 96px 1fr 64px; gap: 8px; }
  .shared-days { height: 80px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <a class="back-home" href="/">← 返回博客主页</a>
      <h1>API 用量 · GLM 共享反推</h1>
      <div class="subtitle" id="sub-line">数据由本机定时扫描推送 · 页面每分钟自动刷新</div>
    </div>
    <div class="controls">
      <div class="tabs" id="tabs"></div>
      <button class="refresh" id="refresh-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        刷新
      </button>
      <span class="countdown" id="countdown"></span>
    </div>
  </div>

  <section class="card">
    <div class="card-head">
      <div>
        <h2>GLM 共享用量反推</h2>
        <div class="card-sub">订阅 Key 借给他人使用时，官方只记账号总量 —— 他人用量 = BigModel 网页总用量 − 本机（ZCode 走 GLM 官方的记录）</div>
      </div>
    </div>
    <div class="status-line" id="status-line"></div>
    <div class="quota-wrap" id="quota"></div>
    <div id="body"></div>
  </section>

  <footer>
    <b>口径说明</b>：他人用量 = BigModel 官方账号总量 − 本机消耗（反推），方舟、a8pi 等中转上的 glm 模型不计入官方总量。
    数值偶尔为负属正常现象——官方接口有分钟级统计延迟，稍后自动对齐。
    本页数据每 10 分钟自动扫描推送，页面每 60 秒自动拉取最新数据。
  </footer>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
'use strict';
/* ---------------- 工具 ---------------- */
function fmt(n) {
  if (!isFinite(n)) return '-';
  if (n < 0) return '-' + fmt(-n);
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 1 : 2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(Math.round(n));
}
function fmtFull(n) { return Math.round(n).toLocaleString('en-US'); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------------- 状态 ---------------- */
const RANGE_TABS = [['today', '今天'], ['week', '本周'], ['last7', '近 7 天'], ['month', '本月'], ['all', '全部']];
const REFRESH_MS = 60000;
const state = { range: 'week', data: null, lastLoadOk: true, nextLoadAt: 0 };

/* ---------------- 数据加载 ---------------- */
async function load(manual) {
  const btn = document.getElementById('refresh-btn');
  if (manual) { btn.disabled = true; btn.classList.add('spinning'); }
  try {
    const res = await fetch('usage.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.data = await res.json();
    state.lastLoadOk = true;
    render();
  } catch (e) {
    state.lastLoadOk = false;
    renderStatus();
    renderQuota();
    document.getElementById('sub-line').textContent =
      '拉取失败（' + esc(e.message) + '），显示上次数据 · 页面每分钟自动刷新';
  } finally {
    if (manual) setTimeout(() => { btn.disabled = false; btn.classList.remove('spinning'); }, 500);
  }
  state.nextLoadAt = Date.now() + REFRESH_MS;
}

/* ---------------- 渲染 ---------------- */
function badgeOf(s) {
  if (s === 'ok') return ['ok', '正常'];
  if (s === 'ok-stale') return ['stale', '沿用缓存'];
  if (s === 'expired') return ['warn', '登录过期'];
  if (s === 'no-credential') return ['muted', '未登录'];
  return ['muted', s || '未知'];
}

function renderStatus() {
  const d = state.data;
  const line = document.getElementById('status-line');
  if (!d) { line.innerHTML = ''; return; }

  const [cls, txt] = badgeOf(d.webStatus);
  let html = `<span class="badge ${cls}">${esc(txt)}</span>` +
    (d.webNote ? `<span class="note">${esc(d.webNote)}</span>` : '');
  if (d.quota && d.quota.level) html += `<span class="quota-chip">套餐 <b>${esc(d.quota.level)}</b></span>`;
  if (!state.lastLoadOk) html += `<span class="badge warn">刷新失败</span>`;
  line.innerHTML = html;
}

/* ---------------- 套餐额度卡片（进度条 + 重置倒计时） ---------------- */
function renderQuota() {
  const box = document.getElementById('quota');
  const q = state.data && state.data.quota;
  const limits = (q && Array.isArray(q.limits)) ? q.limits : [];
  if (!limits.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="quota-grid">' + limits.map((l) => {
    const pct = l.pct != null ? l.pct : (l.total ? Math.round(l.used / l.total * 100) : null);
    const cls = pct == null ? '' : pct >= 90 ? ' danger' : pct >= 70 ? ' warn' : '';
    return `<div class="q-card${cls}">
      <div class="q-head"><span class="q-label">${esc(l.label)}</span><span class="q-pct">${pct != null ? pct + '%' : ''}</span></div>
      <div class="q-bar"><div class="q-fill" style="width:${Math.min(pct || 0, 100)}%"></div></div>
      <div class="q-meta">
        <span class="q-used">已用 ${fmtFull(l.used)}${l.total != null ? ' / ' + fmtFull(l.total) : ''}</span>
        <span class="q-reset" data-reset="${l.resetAt || ''}"></span>
      </div>
    </div>`;
  }).join('') + '</div>';
  updateResetCountdowns();
}

function updateResetCountdowns() {
  document.querySelectorAll('.q-reset[data-reset]').forEach((el) => {
    const ts = Number(el.dataset.reset);
    if (!ts) { el.textContent = ''; return; }
    const ms = ts - Date.now();
    if (ms <= 0) { el.textContent = '重置中'; return; }
    const h = Math.floor(ms / 3600e3), m = Math.floor((ms % 3600e3) / 60e3), s = Math.floor((ms % 60e3) / 1000);
    el.textContent = h >= 24
      ? `${Math.floor(h / 24)} 天 ${h % 24} 小时后重置`
      : h > 0 ? `${h} 小时 ${m} 分后重置` : `${m} 分 ${s} 秒后重置`;
  });
}

function kpiCard(label, value, color, extra) {
  return `<div class="kpi">
    <div class="k-label"><span class="k-dot" style="background:${color}"></span>${esc(label)}</div>
    <div class="k-value">${value}</div>
    <div class="k-extra">${esc(extra)}</div>
  </div>`;
}

function render() {
  const d = state.data;
  renderStatus();
  renderQuota();
  const body = document.getElementById('body');
  if (!d) { body.innerHTML = '<div class="chart-empty">正在加载数据…</div>'; return; }

  document.getElementById('sub-line').textContent =
    '数据生成于 ' + esc(d.generatedAtText || '') + ' · 本机每 10 分钟推送 · 页面每分钟自动刷新';

  if (d.webStatus !== 'ok' && d.webStatus !== 'ok-stale') {
    const msg = d.webStatus === 'expired' ? '数据源登录已过期，等待本机重新登录 BigModel 后自动恢复'
      : d.webStatus === 'no-credential' ? '数据源未登录，等待本机登录 BigModel 后自动恢复'
      : '所选范围内暂无数据';
    body.innerHTML = `<div class="chart-empty">${esc(msg)}</div>`;
    return;
  }

  const r = (d.ranges || {})[state.range] || d.ranges.week;
  const k = r.kpi;
  const neg = k.other < 0;
  const kpis = [
    kpiCard('他人用量（反推）', fmt(k.other), neg ? '#98a2b3' : '#4f6df5', neg ? '官方接口有分钟级延迟，为负稍后自动对齐' : 'BigModel 官方口径'),
  ];

  // 按天柱：他人用量
  const max = Math.max(...r.days.map((b) => b.other), 1);
  let bars = '';
  for (const b of r.days) {
    if (b.other <= 0) {
      bars += `<div class="shared-day empty"><div class="sd-bar"></div><span class="dt">${esc(b.label)}</span></div>`;
      continue;
    }
    const tip = `${b.key} · 他人 ${fmt(b.other)}`;
    bars += `<div class="shared-day" data-tip="${esc(tip)}">
      <div class="sd-bar" style="height:${Math.max((b.other / max) * 100, 2)}%;background:#4f6df5"></div>
      <span class="dt">${esc(b.label)}</span></div>`;
  }

  // 按模型（他人用量）
  const mmax = Math.max(...r.models.map((m) => m.other), 1);
  const rows = r.models.map((m) => {
    return `<div class="mrow">
      <div class="mname" title="${esc(m.m)}">${esc(m.m)}</div>
      <div class="mbar-wrap"><div class="mbar">
        <div class="seg" style="width:${(Math.max(0, m.other) / mmax) * 100}%;background:#4f6df5" data-tip="${esc(m.m)} · 他人|${fmtFull(m.other)}"></div>
      </div></div>
      <div class="mtotal">${fmt(m.other)}</div>
    </div>`;
  }).join('');

  body.innerHTML = `
    <div class="kpis" style="grid-template-columns:1fr;max-width:340px">${kpis.join('')}</div>
    <div class="chart-title">${esc(r.chartTitle)}（悬停查看明细）</div>
    <div class="shared-days">${bars}</div>
    <div class="legend">
      <span class="li"><span class="dot" style="background:#4f6df5"></span>他人 <span class="val">${fmt(k.other)}</span></span>
    </div>
    <div class="models">
      <div class="sub-title">按模型（他人用量）</div>
      ${rows || '<div class="chart-empty">所选范围内暂无模型数据</div>'}
    </div>`;
}

/* ---------------- 交互 ---------------- */
const tabsBox = document.getElementById('tabs');
tabsBox.innerHTML = RANGE_TABS.map(([id, label]) =>
  `<button data-range="${id}" class="${id === state.range ? 'active' : ''}">${label}</button>`).join('');
tabsBox.onclick = (ev) => {
  const b = ev.target.closest('button[data-range]');
  if (!b) return;
  state.range = b.dataset.range;
  tabsBox.querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b));
  render();
};
document.getElementById('refresh-btn').onclick = () => load(true);

const tip = document.getElementById('tooltip');
document.addEventListener('mousemove', (ev) => {
  const t = ev.target.closest('[data-tip]');
  if (t && t.dataset.tip) {
    const [head, val] = t.dataset.tip.split('|');
    tip.innerHTML = `<div>${esc(head)}</div>` + (val ? `<div>${esc(val)}</div>` : '');
    tip.style.display = 'block';
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.max(ev.clientY - tip.offsetHeight - 10, 8) + 'px';
  } else {
    tip.style.display = 'none';
  }
});

setInterval(() => load(false), REFRESH_MS);
setInterval(updateResetCountdowns, 1000);
setInterval(() => {
  const s = Math.max(0, Math.ceil((state.nextLoadAt - Date.now()) / 1000));
  document.getElementById('countdown').textContent = s > 0 ? s + 's 后刷新' : '刷新中…';
}, 1000);

load(false);
</script>
</body>
</html>
